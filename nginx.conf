server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location ~ /\. {
        deny all;
        return 404;
    }

    location ~* ^/assets/|\.(?:css|js|woff2?|eot|ttf|otf|ico|png|jpe?g|gif|svg|webp|xml|txt|json|map)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}